const haversine = (lat1, lng1, lat2, lng2) => {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
};

const VBarChart = ({ data, height = 220, color = '#0d9488', valueKey = 'value', labelKey = 'label', showValues = true }) => {
  const maxVal = Math.max(...data.map(d => d[valueKey]));
  return html`
    <div className="w-full">
      <div className="flex items-end gap-1.5" style=${{ height: height + 'px' }}>
        ${data.map((d, i) => {
          const h = (d[valueKey] / maxVal) * (height - 30);
          return html`
            <div key=${i} className="flex-1 min-w-0 flex flex-col items-center justify-end group">
              <div className="chart-bar w-full rounded-t-md cursor-pointer relative" 
                   style=${{ height: Math.max(h, 4) + 'px', backgroundColor: color, minHeight: '4px' }}
                   title=${`${d[labelKey]}: ${d[valueKey]}`}>
                ${showValues && html`<span className="absolute -top-5 left-0 right-0 text-center text-xs font-semibold text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">${d[valueKey]}</span>`}
              </div>
              <span className="text-[10px] text-slate-500 mt-1.5 truncate w-full text-center leading-tight">${d[labelKey]}</span>
            </div>
          `;
        })}
      </div>
    </div>
  `;
};

const HBarChart = ({ data, color = '#0d9488', valueKey = 'value', labelKey = 'label', showValues = true }) => {
  const maxVal = Math.max(...data.map(d => d[valueKey]));
  return html`
    <div className="w-full space-y-2.5">
      ${data.map((d, i) => html`
        <div key=${i} className="flex items-center gap-3">
          <span className="text-xs text-slate-600 w-28 flex-shrink-0 truncate text-right">${d[labelKey]}</span>
          <div className="flex-1 bg-slate-100 rounded-md overflow-hidden h-6 relative">
            <div className="chart-bar h-full rounded-md flex items-center justify-end px-2" 
                 style=${{ width: `${(d[valueKey] / maxVal) * 100}%`, backgroundColor: color, minWidth: '24px' }}>
              ${showValues && html`<span className="text-[10px] font-bold text-white">${d[valueKey]}</span>`}
            </div>
          </div>
        </div>
      `)}
    </div>
  `;
};

const LineChart = ({ data, height = 200, series = [{ key: 'jobs', label: 'Jobs', color: '#0d9488' }], xKey = 'month' }) => {
  const allValues = series.flatMap(s => data.map(d => d[s.key]));
  const maxVal = Math.max(...allValues);
  const range = maxVal || 1;
  const w = 100, h = 100;
  const xStep = data.length > 1 ? w / (data.length - 1) : 0;
  return html`
    <div className="w-full">
      <div className="flex gap-4 mb-3">
        ${series.map((s, i) => html`
          <div key=${i} className="flex items-center gap-1.5">
            <span className="w-3 h-1.5 rounded-sm" style=${{ backgroundColor: s.color }}></span>
            <span className="text-xs text-slate-600">${s.label}</span>
          </div>
        `)}
      </div>
      <div className="relative" style=${{ height: height + 'px' }}>
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" className="w-full h-full" style=${{ overflow: 'visible' }}>
          <defs>
            ${series.map((s, i) => html`
              <linearGradient key=${i} id=${`grad-${i}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor=${s.color} stopOpacity="0.2" />
                <stop offset="100%" stopColor=${s.color} stopOpacity="0" />
              </linearGradient>
            `)}
          </defs>
          ${[25, 50, 75].map(y => html`<line key=${y} x1="0" y1=${y} x2=${w} y2=${y} stroke="#e2e8f0" strokeWidth="0.2" />`)}
          ${series.map((s, si) => {
            const points = data.map((d, i) => ({ x: i * xStep, y: h - ((d[s.key]) / range) * (h - 10) - 5 }));
            const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
            const areaD = pathD + ` L${w},${h} L0,${h} Z`;
            return html`
              <path key=${`area-${si}`} d=${areaD} fill=${`url(#grad-${si})`} />
              <path key=${`line-${si}`} d=${pathD} fill="none" stroke=${s.color} strokeWidth="0.8" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
              ${points.map((p, i) => html`<circle key=${`pt-${si}-${i}`} cx=${p.x} cy=${p.y} r="0.8" fill="white" stroke=${s.color} strokeWidth="0.5" vectorEffect="non-scaling-stroke" />`)}
            `;
          })}
        </svg>
        <div className="absolute bottom-0 left-0 right-0 flex justify-between text-[10px] text-slate-400">
          ${data.map((d, i) => html`<span key=${i} className=${i % 2 === 0 ? '' : 'hidden sm:inline'}>${d[xKey]}</span>`)}
        </div>
      </div>
    </div>
  `;
};

const RangeBarChart = ({ data }) => {
  const allVals = data.flatMap(d => [d.min, d.max]);
  const globalMin = Math.min(...allVals);
  const globalMax = Math.max(...allVals);
  const range = globalMax - globalMin;
  return html`
    <div className="w-full space-y-3">
      ${data.map((d, i) => {
        const leftPct = ((d.min - globalMin) / range) * 100;
        const widthPct = ((d.max - d.min) / range) * 100;
        const medPct = ((d.median - globalMin) / range) * 100;
        return html`
          <div key=${i} className="flex items-center gap-3">
            <span className="text-xs text-slate-600 w-28 flex-shrink-0 text-right truncate">${d.role}</span>
            <div className="flex-1 relative h-6">
              <div className="absolute inset-0 bg-slate-100 rounded-md"></div>
              <div className="absolute h-full rounded-md bg-gradient-to-r from-teal-200 to-teal-400" 
                   style=${{ left: leftPct + '%', width: widthPct + '%' }}></div>
              <div className="absolute top-0 bottom-0 w-0.5 bg-slate-700" style=${{ left: medPct + '%' }}></div>
              <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-medium text-slate-700">RM${(d.min/1000).toFixed(1)}-${(d.max/1000).toFixed(1)}k</span>
            </div>
          </div>
        `;
      })}
      <div className="flex justify-between text-[10px] text-slate-400 pt-1">
        <span>RM${(globalMin/1000).toFixed(1)}k</span>
        <span>RM${(globalMax/1000).toFixed(1)}k</span>
      </div>
    </div>
  `;
};

  const { filterPanelOpen, setFilterPanelOpen, filters, setFilters, userLocation } = useApp();
  if (!filterPanelOpen) return null;

  const update = (key, val) => setFilters({ ...filters, [key]: val });
  const toggleArray = (key, val) => {
    const arr = filters[key] || [];
    update(key, arr.includes(val) ? arr.filter(v => v !== val) : [...arr, val]);
  };
  const clearAll = () => setFilters({ states: [], sectors: [], orgTypes: [], verification: [], hasJobs: false, hasInternships: false, hasWebsite: false, hasEmail: false, hasLinkedin: false, software: [], distance: null });

  const ToggleChip = ({ active, onClick, children }) => html`
    <button onClick=${onClick} className=${`px-3 py-1.5 text-xs font-medium rounded-lg border transition-all ${active ? 'bg-teal-50 border-teal-300 text-teal-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
      ${children}
    </button>
  `;

  const SectionTitle = ({ children }) => html`<div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2.5">${children}</div>`;

  return html`
    <div className="fixed inset-0 z-40">
      <div className="absolute inset-0 bg-black/30 anim-fade-in" onClick=${() => setFilterPanelOpen(false)}></div>
      <div className="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-xl anim-slide-in flex flex-col">
        <div className="h-16 flex items-center justify-between px-5 border-b border-slate-200 flex-shrink-0">
          <div className="flex items-center gap-2">
            <${Icon} name="filter" size=${20} className="text-teal-600" />
            <h2 className="text-base font-semibold text-slate-900">Filters</h2>
          </div>
          <button onClick=${() => setFilterPanelOpen(false)} className="p-2 hover:bg-slate-100 rounded-lg"><${Icon} name="x" size=${20} /></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5 space-y-6">
          ${userLocation && html`
            <div>
              <${SectionTitle}>Distance from ${userLocation.name}</${SectionTitle}>
              <div className="flex flex-wrap gap-2">
                ${[5, 10, 25, 50, 100, null].map(d => html`
                  <${ToggleChip} key=${d} active=${filters.distance === d} onClick=${() => update('distance', d)}>
                    ${d ? `${d} km` : 'Any distance'}
                  </>
                `)}
              </div>
            </div>
          `}
          <div>
            <${SectionTitle}>State</${SectionTitle}>
            <div className="flex flex-wrap gap-2">
              ${MALAYSIAN_STATES.map(s => html`<${ToggleChip} key=${s} active=${(filters.states||[]).includes(s)} onClick=${() => toggleArray('states', s)}>${s}</>`)}
            </div>
          </div>
          <div>
            <${SectionTitle}>Sector</${SectionTitle}>
            <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
              ${SECTOR_NAMES.map(s => html`<${ToggleChip} key=${s} active=${(filters.sectors||[]).includes(s)} onClick=${() => toggleArray('sectors', s)}>${s}</>`)}
            </div>
          </div>
          <div>
            <${SectionTitle}>Organisation Type</${SectionTitle}>
            <div className="flex flex-wrap gap-2">
              ${ORG_TYPES.map(t => html`<${ToggleChip} key=${t} active=${(filters.orgTypes||[]).includes(t)} onClick=${() => toggleArray('orgTypes', t)}>${t}</>`)}
            </div>
          </div>
          <div>
            <${SectionTitle}>Verification Status</${SectionTitle}>
            <div className="flex flex-wrap gap-2">
              ${Object.keys(VERIFICATION_LABELS).map(v => html`<${ToggleChip} key=${v} active=${(filters.verification||[]).includes(v)} onClick=${() => toggleArray('verification', v)}>${VERIFICATION_LABELS[v].label}</>`)}
            </div>
          </div>
          <div>
            <${SectionTitle}>Opportunities</${SectionTitle}>
            <div className="space-y-2">
              <label className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                <input type="checkbox" checked=${filters.hasJobs||false} onChange=${e => update('hasJobs', e.target.checked)} className="w-4 h-4 rounded text-teal-600 focus:ring-teal-400" />
                Has active jobs
              </label>
              <label className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                <input type="checkbox" checked=${filters.hasInternships||false} onChange=${e => update('hasInternships', e.target.checked)} className="w-4 h-4 rounded text-teal-600 focus:ring-teal-400" />
                Has active internships
              </label>
            </div>
          </div>
          <div>
            <${SectionTitle}>Contact & Links</${SectionTitle}>
            <div className="space-y-2">
              ${['hasWebsite','hasEmail','hasLinkedin'].map(k => html`
                <label key=${k} className="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                  <input type="checkbox" checked=${filters[k]||false} onChange=${e => update(k, e.target.checked)} className="w-4 h-4 rounded text-teal-600 focus:ring-teal-400" />

              `)}

          </div>
          <div>
            <${SectionTitle}>Software</${SectionTitle}>
            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
              ${SOFTWARE_LIST.map(s => html`<${ToggleChip} key=${s} active=${(filters.software||[]).includes(s)} onClick=${() => toggleArray('software', s)}>${s}</>`)}

          <button onClick=${clearAll} className="text-sm font-medium text-slate-600 hover:text-slate-900">Clear all filters</button>

  `;

const ActiveFilterChips = () => {
  const { filters, setFilters } = useApp();
  const chips = [];
  (filters.states||[]).forEach(s => chips.push({ key: 'states', val: s, label: s }));
  (filters.sectors||[]).forEach(s => chips.push({ key: 'sectors', val: s, label: s }));
  (filters.orgTypes||[]).forEach(s => chips.push({ key: 'orgTypes', val: s, label: s }));
  (filters.verification||[]).forEach(s => chips.push({ key: 'verification', val: s, label: VERIFICATION_LABELS[s]?.label || s }));
  (filters.software||[]).forEach(s => chips.push({ key: 'software', val: s, label: s }));
  if (filters.hasJobs) chips.push({ key: 'hasJobs', val: true, label: 'Has jobs' });
  if (filters.hasInternships) chips.push({ key: 'hasInternships', val: true, label: 'Has internships' });
  if (filters.hasWebsite) chips.push({ key: 'hasWebsite', val: true, label: 'Has website' });
  if (filters.hasEmail) chips.push({ key: 'hasEmail', val: true, label: 'Has email' });
  if (filters.hasLinkedin) chips.push({ key: 'hasLinkedin', val: true, label: 'Has LinkedIn' });
  if (filters.distance) chips.push({ key: 'distance', val: filters.distance, label: `Within ${filters.distance} km` });

  if (chips.length === 0) return null;
  const remove = (chip) => {
    if (typeof chip.val === 'boolean') {
      setFilters({ ...filters, [chip.key]: false });
    } else if (chip.key === 'distance') {
      setFilters({ ...filters, distance: null });
    } else {
      setFilters({ ...filters, [chip.key]: (filters[chip.key]||[]).filter(v => v !== chip.val) });
    }
  };

  return html`
    <div className="flex flex-wrap items-center gap-1.5">
      ${chips.map((c, i) => html`
        <span key=${i} className="inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium bg-teal-50 text-teal-700 rounded-md border border-teal-200">
          ${c.label}
          <button onClick=${() => remove(c)} className="hover:text-teal-900"><${Icon} name="x" size=${12} /></button>
        </span>
      `)}
      <button onClick=${() => setFilters({ states:[], sectors:[], orgTypes:[], verification:[], hasJobs:false, hasInternships:false, hasWebsite:false, hasEmail:false, hasLinkedin:false, software:[], distance:null })}
              className="text-xs text-slate-500 hover:text-slate-700 underline">Clear all</button>
    </div>
  `;
};

const MAP_STYLES = {
  light: { version: 8, sources: { carto: { type: 'raster', tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors © CARTO' } }, layers: [{ id: 'carto', type: 'raster', source: 'carto' }] },
  streets: { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors' } }, layers: [{ id: 'osm', type: 'raster', source: 'osm' }] },
  dark: { version: 8, sources: { carto: { type: 'raster', tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png','https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors © CARTO' } }, layers: [{ id: 'carto', type: 'raster', source: 'carto' }] }
};

const MalaysiaMap = ({ companies, onMarkerClick, height = '100%', showControls = true, style: styleName = 'light', cluster = true, userLocation, compact = false }) => {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const [mapReady, setMapReady] = useState(false);
  const [currentStyle, setCurrentStyle] = useState(styleName);
  const [clusterEnabled, setClusterEnabled] = useState(cluster);
  const [styleOpen, setStyleOpen] = useState(false);

  useEffect(() => {
    if (!containerRef.current || mapRef.current) return;
    const map = new maplibregl.Map({
      container: containerRef.current,
      style: MAP_STYLES[currentStyle],
      center: [111.5, 4.0],
      zoom: 5.2,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    map.on('load', () => {
      setMapReady(true);
      mapRef.current = map;
      updateSources();
    });

    return () => { map.remove(); mapRef.current = null; };
  }, []);

  const updateSources = useCallback(() => {
    const map = mapRef.current;
    if (!map || !mapReady) return;

    const features = companies.map(c => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
      properties: {
        id: c.id, name: c.name, sector: c.primarySector,
        sectorColor: SECTORS[c.primarySector]?.color || '#6b7280',
        orgType: c.orgType, city: c.city, state: c.state,
        verification: c.verification, activeJobs: c.activeJobs, activeInternships: c.activeInternships,
        secondarySectors: (c.secondarySectors||[]).join(', '),
      }
    }));

    const geojson = { type: 'FeatureCollection', features };

    if (map.getSource('companies')) {
      map.getSource('companies').setData(geojson);
    } else {
      map.addSource('companies', { type: 'geojson', data: geojson, cluster: clusterEnabled, clusterMaxZoom: 12, clusterRadius: 45 });

      map.addLayer({
        id: 'clusters', type: 'circle', source: 'companies', filter: ['has', 'point_count'],
        paint: {
          'circle-color': ['step', ['get', 'point_count'], '#5eead4', 5, '#14b8a6', 15, '#0f766e'],
          'circle-radius': ['step', ['get', 'point_count'], 18, 5, 22, 15, 28],
          'circle-opacity': 0.85, 'circle-stroke-width': 2.5, 'circle-stroke-color': '#ffffff',
        }
      });
      map.addLayer({
        id: 'cluster-count', type: 'symbol', source: 'companies', filter: ['has', 'point_count'],
        layout: { 'text-field': '{point_count_abbreviated}', 'text-size': 13, 'text-font': ['Noto Sans Regular'] },
        paint: { 'text-color': '#ffffff' }
      });
      map.addLayer({
        id: 'unclustered-point-halo', type: 'circle', source: 'companies', filter: ['!', ['has', 'point_count']],
        paint: { 'circle-color': ['get', 'sectorColor'], 'circle-radius': compact ? 10 : 13, 'circle-opacity': 0.2 },
      });
      map.addLayer({
        id: 'unclustered-point', type: 'circle', source: 'companies', filter: ['!', ['has', 'point_count']],
        paint: {
          'circle-color': ['get', 'sectorColor'], 'circle-radius': compact ? 6 : 8,
          'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff', 'circle-opacity': 0.9,
        }
      }, 'unclustered-point-halo');

      map.on('click', 'unclustered-point', (e) => {
        const f = e.features[0];
        const coords = f.geometry.coordinates.slice();
        const p = f.properties;
        const html = `
          <div style="padding:14px;min-width:240px;font-family:Inter,sans-serif;">
            <div style="font-weight:600;font-size:14px;color:#0f172a;margin-bottom:4px;line-height:1.3;">${p.name}</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:6px;">${p.city}, ${p.state}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
              <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${p.sectorColor}15;color:${p.sectorColor};font-weight:500;">${p.sector}</span>
            </div>
            <div style="display:flex;gap:6px;font-size:11px;color:#64748b;margin-bottom:10px;">
              ${p.activeJobs > 0 ? `<span>💼 ${p.activeJobs} jobs</span>` : ''}
              ${p.activeInternships > 0 ? `<span>🎓 ${p.activeInternships} internships</span>` : ''}
            </div>
            <button id="view-profile-${p.id}" style="width:100%;padding:6px 12px;font-size:12px;font-weight:500;color:#fff;background:#0d9488;border:none;border-radius:6px;cursor:pointer;font-family:Inter,sans-serif;">View Profile</button>
          </div>
        `;
        const popup = new maplibregl.Popup({ offset: 15, closeButton: true }).setLngLat(coords).setHTML(html).addTo(map);
        setTimeout(() => {
          const btn = document.getElementById(`view-profile-${p.id}`);
          if (btn) btn.onclick = () => { onMarkerClick && onMarkerClick(p.id); popup.remove(); };
        }, 50);
      });
      map.on('mouseenter', 'unclustered-point', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'unclustered-point', () => map.getCanvas().style.cursor = '');

      map.on('click', 'clusters', (e) => {
        const f = e.features[0];
        const zoom = map.getZoom();
        map.getSource('companies').getClusterExpansionZoom(f.properties.cluster_id).then(targetZoom => {
          map.flyTo({ center: f.geometry.coordinates.slice(), zoom: Math.max(targetZoom, zoom + 1.5), duration: 500 });
        });
      });
      map.on('mouseenter', 'clusters', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'clusters', () => map.getCanvas().style.cursor = '');
    }
  }, [companies, clusterEnabled, compact, onMarkerClick, mapReady]);

  useEffect(() => { if (mapReady) updateSources(); }, [companies, mapReady, updateSources]);

  useEffect(() => {
    const map = mapRef.current;
    if (!map || !mapReady) return;
    if (map.getSource('companies')) {
      map.getSource('companies').setClusterOptions({ cluster: clusterEnabled });
    }
  }, [clusterEnabled, mapReady]);

  useEffect(() => {
    const map = mapRef.current;
    if (!map || !mapReady) return;
    map.setStyle(MAP_STYLES[currentStyle]);
    map.once('style.load', () => updateSources());
  }, [currentStyle]);

  useEffect(() => {
    const map = mapRef.current;
    if (!map || !mapReady || !userLocation) return;
    const el = document.createElement('div');
    el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;box-shadow:0 0 0 4px rgba(37,99,235,0.2);';
    const marker = new maplibregl.Marker(el).setLngLat([userLocation.lng, userLocation.lat]).addTo(map);
    new maplibregl.Popup({ offset: 20, closeButton: false }).setHTML(`<div style="padding:6px;font-size:12px;font-weight:500;">📍 ${userLocation.name}</div>`).setLngLat([userLocation.lng, userLocation.lat]).addTo(map);
    map.flyTo({ center: [userLocation.lng, userLocation.lat], zoom: 11, duration: 1000 });
    return () => marker.remove();
  }, [userLocation, mapReady]);

  const resetMap = () => mapRef.current?.flyTo({ center: [111.5, 4.0], zoom: 5.2, duration: 800 });

  return html`
    <div className="relative w-full" style=${{ height }}>
      <div ref=${containerRef} className="absolute inset-0 rounded-xl overflow-hidden" />
      ${showControls && mapReady && html`
        <div className="absolute top-3 left-3 z-10 flex flex-col gap-2">
          <button onClick=${resetMap} title="Reset map" className="w-9 h-9 bg-white rounded-lg shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors">
            <${Icon} name="home" size=${16} />
          </button>
          <button onClick=${() => setClusterEnabled(!clusterEnabled)} title="Toggle clusters" className=${`w-9 h-9 rounded-lg shadow-md flex items-center justify-center transition-colors ${clusterEnabled ? 'bg-teal-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}>
            <${Icon} name="layers" size=${16} />
          </button>
          <div className="relative">
            <button onClick=${() => setStyleOpen(!styleOpen)} title="Map style" className="w-9 h-9 bg-white rounded-lg shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50">
              <${Icon} name="map" size=${16} />
            </button>
            ${styleOpen && html`
              <div className="absolute left-11 top-0 bg-white rounded-lg shadow-lg border border-slate-200 py-1 min-w-[100px] anim-fade-in">
                ${Object.keys(MAP_STYLES).map(s => html`
                  <button key=${s} onClick=${() => { setCurrentStyle(s); setStyleOpen(false); }}
                          className=${`w-full text-left px-3 py-1.5 text-xs hover:bg-slate-100 ${currentStyle === s ? 'text-teal-600 font-semibold' : 'text-slate-600'}`}>
                    ${s.charAt(0).toUpperCase() + s.slice(1)}
                  </button>
                `)}
              </div>
            `}
          </div>
        </div>
      `}
    </div>
  `;
};

const TravelInfo = ({ company }) => {
  const { userLocation } = useApp();
  const distance = userLocation ? haversine(userLocation.lat, userLocation.lng, company.lat, company.lng) : null;
  if (!distance) return html`<div className="text-xs text-slate-400 p-3 bg-slate-50 rounded-lg">Set your location to see travel info</div>`;
  const drivingTime = Math.ceil(distance / 50 * 60); 
  const ptTime = Math.ceil(distance / 30 * 60);
  return html`
    <div className="grid grid-cols-2 gap-3">
      <div className="flex items-center gap-2 p-2.5 rounded-lg bg-slate-50">
        <${Icon} name="car" size=${16} className="text-slate-500" />
        <div>
          <div className="text-sm font-semibold text-slate-800">${drivingTime} min</div>
          <div className="text-[10px] text-slate-500">~${distance.toFixed(1)} km (mock)</div>
        </div>
      </div>
      <div className="flex items-center gap-2 p-2.5 rounded-lg bg-slate-50">
        <${Icon} name="train" size=${16} className="text-slate-500" />
        <div>
          <div className="text-sm font-semibold text-slate-800">${ptTime} min</div>
          <div className="text-[10px] text-slate-500">Public transport (mock)</div>
        </div>
      </div>
      <a href=${`https://www.google.com/maps/dir/?api=1&destination=${company.lat},${company.lng}`} target="_blank" rel="noopener"
         className="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
        <${Icon} name="navigation" size=${14} /> Google Maps
      </a>
      <a href=${`https://waze.com/ul?ll=${company.lat},${company.lng}&navigate=yes`} target="_blank" rel="noopener"
         className="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium text-slate-700 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">
        <${Icon} name="route" size=${14} /> Waze
      </a>
    </div>
  `;
};

/* ════════════════════════════════════════════════════════════════════════════
   MAIN APP
   ════════════════════════════════════════════════════════════════════════════ */

const App = () => {
  const [currentPage, setCurrentPage] = useState('overview');
  const [searchQuery, setSearchQuery] = useState('');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
  const [filterPanelOpen, setFilterPanelOpen] = useState(false);
  const [userLocation, setUserLocation] = useState(null);
  const [selectedCompany, setSelectedCompany] = useState(null);
  const [filters, setFilters] = useState({ states: [], sectors: [], orgTypes: [], verification: [], hasJobs: false, hasInternships: false, hasWebsite: false, hasEmail: false, hasLinkedin: false, software: [], distance: null });

  const navigate = (page, params) => {
    setCurrentPage(page);
    setMobileSidebarOpen(false);
    if (params?.companyId) setSelectedCompany(params.companyId);
    if (page === 'map' || page === 'directory' || page === 'overview') {
      // scroll to top or similar
    }
    window.scrollTo(0, 0);
  };

  const activeFilterCount = useMemo(() => {
    let count = 0;
    Object.keys(filters).forEach(k => {
      if (Array.isArray(filters[k]) && filters[k].length > 0) count += filters[k].length;
      else if (filters[k] === true) count += 1;
      else if (k === 'distance' && filters[k] !== null) count += 1;
    });
    return count;
  }, [filters]);

  const filteredCompanies = useMemo(() => {
    return COMPANIES.filter(c => {
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const inName = c.name.toLowerCase().includes(q);
        const inDesc = c.desc.toLowerCase().includes(q);
        const inCity = c.city.toLowerCase().includes(q);
        const inState = c.state.toLowerCase().includes(q);
        const inSector = c.primarySector.toLowerCase().includes(q) || (c.secondarySectors || []).some(s => s.toLowerCase().includes(q));
        const inSoftware = (c.software || []).some(s => s.n.toLowerCase().includes(q));
        if (!inName && !inDesc && !inCity && !inState && !inSector && !inSoftware) return false;
      }
      if (filters.states?.length && !filters.states.includes(c.state)) return false;
      if (filters.sectors?.length && !filters.sectors.includes(c.primarySector) && !(c.secondarySectors || []).some(s => filters.sectors.includes(s))) return false;
      if (filters.orgTypes?.length && !filters.orgTypes.includes(c.orgType)) return false;
      if (filters.verification?.length && !filters.verification.includes(c.verification)) return false;
      if (filters.hasJobs && c.activeJobs === 0) return false;
      if (filters.hasInternships && c.activeInternships === 0) return false;
      if (filters.hasWebsite && !c.website) return false;
      if (filters.hasEmail && !c.email) return false;
      if (filters.hasLinkedin && !c.linkedin) return false;
      if (filters.software?.length && !filters.software.some(s => (c.software || []).some(cs => cs.n === s))) return false;
      if (filters.distance && userLocation) {
        const dist = haversine(userLocation.lat, userLocation.lng, c.lat, c.lng);
        if (dist > filters.distance) return false;
      }
      return true;
    });
  }, [searchQuery, filters, userLocation]);

  const renderPage = () => {
    switch (currentPage) {
      case 'overview': return html`<${OverviewPage} />`;
      case 'map': return html`<${CompanyMapPage} />`;
      case 'directory': return html`<${DirectoryPage} />`;
      case 'jobs': return html`<${JobsPage} />`;
      case 'internships': return html`<${JobsPage} internshipOnly=${true} />`;
      case 'industry-state': return html`<${IndustryByStatePage} />`;
      case 'industry-sector': return html`<${IndustryBySectorPage} />`;
      case 'hiring-trends': return html`<${HiringTrendsPage} />`;
      case 'salary-insights': return html`<${SalaryInsightsPage} />`;
      case 'submit-company': return html`<${SimpleFormPage} title="Submit a Company" desc="Suggest a new organisation to be added to the directory." type="submit" />`;
      case 'report-data': return html`<${SimpleFormPage} title="Report Incorrect Data" desc="Help us keep the data accurate and trustworthy." type="report" />`;
      case 'data-sources': return html`<${DataSourcesPage} />`;
      case 'about': return html`<${AboutPage} />`;
      default: return html`<${OverviewPage} />`;
    }
  };

  const contextValue = {
    currentPage, navigate, searchQuery, setSearchQuery,
    sidebarCollapsed, setSidebarCollapsed,
    mobileSidebarOpen, setMobileSidebarOpen,
    filterPanelOpen, setFilterPanelOpen,
    userLocation, setUserLocation,
    selectedCompany, setSelectedCompany,
    filters, setFilters,
    filteredCompanies, activeFilterCount,
  };

  return html`
    <${AppContext.Provider} value=${contextValue}>
      <div className="flex h-screen overflow-hidden bg-slate-50">
        <${Sidebar} />
        <${MobileSidebar} />
        <div className="flex-1 flex flex-col overflow-hidden">
          <${TopHeader} />
          <main className="flex-1 overflow-y-auto">
            ${renderPage()}
          </main>
        </div>
        <${FilterPanel} />
        <${CompanyProfileDrawer} />
      </div>
    </>
  `;
};

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
